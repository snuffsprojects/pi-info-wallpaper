name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Python tests
        run: python -m unittest discover -v
      - name: Python syntax
        run: python -m py_compile pi-wallpaper.py
      - name: Shell syntax
        run: bash -n install.sh install-from-web.sh deploy.sh deploy-all.sh pi-wallpaper-refresh uninstall.sh
