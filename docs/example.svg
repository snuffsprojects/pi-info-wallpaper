  <text x="78" y="292" class="label">MEMORY</text><text x="205" y="292" class="value">8 GB</text>
  <text x="78" y="334" class="label">IP ADDRESS</text><text x="205" y="334" class="value">192.0.2.25</text>
  <text x="78" y="376" class="label">OS</text><text x="205" y="376" class="value">Raspberry Pi OS</text>
  <text x="78" y="418" class="label">ROLE</text><text x="205" y="418" class="value">Office display</text>
  <text x="78" y="460" class="label">UPTIME</text><text x="205" y="460" class="value">2d 3h</text>
